syntax = "proto3";

package openconfig.qualificationreporter;

import "test_result.proto";
import "pcr.proto";

option go_package = "github.com/openconfig/qualification-reporter/proto";

// QualificationReport encapsulates image metadata, standardized PCR
// measurements, and raw test execution results submitted by vendors.
message QualificationReport {
  ImageMetadata image_metadata = 1;

  // Target vendor identity.
  Vendor vendor = 2;

  // Standardized PCR measurements for platform integrity verification.
  PCRResponse pcr_response = 3;

  // Factual test results for all evaluated test cases.
  repeated ondatra.TestResult feature_profile_test_results = 4;

  // ID of the release intent associated with this qualification report.
  string release_intent_id = 5;

  // Git commit SHA of the openconfig/featureprofiles repository from which
  // tests were executed.
  string featureprofiles_commit_id = 6;
}

enum Vendor {
  VENDOR_UNSPECIFIED = 0;
  VENDOR_ARISTA = 1;
  VENDOR_CISCO = 2;
  VENDOR_JUNIPER = 3;
  VENDOR_NOKIA = 4;
}

// ImageMetadata defines parameters needed for binary image verification.
message ImageMetadata {
  string image_name = 1;
  string software_version = 2;
  oneof checksum {
    string sha256 = 3;
    // MD5 is deprecated due to collision risks (go/No-MD5).
    string md5 = 4 [deprecated = true];
  }
  bool is_engineering_build = 5;
  string chassis_mpn = 6;
}
