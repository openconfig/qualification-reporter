syntax = "proto3";

package openconfig.qualificationreporter;

option go_package = "github.com/openconfig/qualification-reporter/proto";

// PlatformType defines the target execution environment for qualification.
enum PlatformType {
  PLATFORM_TYPE_UNSPECIFIED = 0;
  // Execution on physical hardware testbeds.
  PLATFORM_TYPE_HARDWARE = 1;
  // Execution in Kubernetes Network Emulation (KNE) virtual environment.
  PLATFORM_TYPE_KNE = 2;
}

// ReleaseIntent defines the feature profile tests excluded from qualifying a
// target release. All other tests in the featureprofiles test registry are
// expected to be run.
message ReleaseIntent {
  // Canonical identifier for the release (e.g., "August_2026_GA").
  string release_id = 1;

  // Deprecated: use excluded_tests instead. This field will be removed and
  // its number reserved once all consumers have migrated.
  repeated string intended_test_ids = 2 [deprecated = true];

  // Target chassis Model Part Numbers (e.g., "DCS-7280CR3K-32D4",
  // "3HE14838AA"). Multiple MPNs may be specified for abstract SKUs with
  // multiple hardware variants.
  repeated string chassis_mpns = 3;

  // Target execution platform (e.g., HARDWARE or KNE virtual environment).
  PlatformType target_platform = 4;

  // Tests excluded from qualification. All other tests in the featureprofiles
  // test registry are expected to be run. An empty list means no tests are
  // excluded.
  repeated ExcludedTest excluded_tests = 5;
}

// ExcludedTest identifies a feature profile test excluded from qualification.
message ExcludedTest {
  // Test registry ID of the excluded test (e.g., "BGP-1.2").
  string test_id = 1;
}
